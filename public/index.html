<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e111a" />
    <title>Luma — your space to connect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://unpkg.com/lucide@latest"></script><script src="https://js.pusher.com/8.4.0/pusher.min.js"></script><script src="https://unpkg.com/livekit-client@2.15.6/dist/livekit-client.umd.min.js"></script>
    <style>
      svg { width: 16px; height: 16px; stroke-width: 2; vertical-align: middle; }
      .brand-mark svg { width: 21px; height: 21px; } .rail-icon svg { width: 18px; height: 18px; }
      .header-hash { width: 25px; height: 25px; } .welcome-symbol svg { width: 27px; height: 27px; }
      .hash { width: 17px; height: 17px; } .speaker { width: 15px; height: 15px; }
      .compose-add svg { width: 18px; height: 18px; } .send-button svg { width: 16px; height: 16px; }
      .empty-state { color: #7d88a0; text-align: center; padding: 48px 0; font-size: 12px; }
      .message-tools { display: inline-flex; gap: 3px; margin-left: 8px; opacity: 0; transition: opacity .15s; }
      .message:hover .message-tools { opacity: 1; } .message-tools button { border: 0; border-radius: 4px; background: #2b3347; color: #9ca6bb; cursor: pointer; width: 22px; height: 20px; }
      .message-tools button:hover { color: #fff; background: #4a5571; }
      .attachment-link { display: inline-block; margin-top: 8px; padding: 8px 10px; border-radius: 6px; background: #232c40; color: #bdb3ff; font-size: 11px; text-decoration: none; }
      .profile-modal { display: none; position: fixed; inset: 0; z-index: 20; align-items: center; justify-content: center; } .profile-modal.open { display: flex; }
      .profile-backdrop { position: absolute; inset: 0; background: #070a12aa; backdrop-filter: blur(4px); } .profile-card { position: relative; width: min(340px, calc(100% - 32px)); border: 1px solid #35405a; border-radius: 16px; background: #1b2232; padding: 30px; text-align: center; box-shadow: 0 24px 70px #0008; }
      .profile-close { position: absolute; right: 14px; top: 12px; border: 0; background: transparent; color: #8190aa; font-size: 22px; cursor: pointer; } .profile-avatar { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 20px; display: grid; place-items: center; background: #b9a5ff; color: #28334b; font-weight: 700; font-size: 18px; } .profile-handle { color: #8290aa; font-size: 11px; margin: 0; } .profile-card h2 { font: 600 22px var(--display); margin: 5px 0; } .profile-status { color: #8fdcb9; font-size: 12px; margin: 8px 0 22px; } .profile-actions button { width: 100%; border: 0; border-radius: 8px; padding: 11px; background: #7667de; color: white; font-weight: 700; cursor: pointer; } .profile-actions button.secondary { background: #2a3449; color: #c2c9d8; margin-top: 8px; }
      @media (max-width:1100px) { .member-sidebar.member-sidebar-open { display: block; position: fixed; z-index: 5; right: 0; top: 0; bottom: 0; width: 246px; box-shadow: -12px 0 30px #0008; } }
    </style>
    <style>
      .voice-modal{display:none;position:fixed;inset:0;z-index:25;align-items:center;justify-content:center;background:#070a12bb;backdrop-filter:blur(5px)}.voice-modal.open{display:flex}.voice-card{width:min(720px,calc(100% - 30px));min-height:410px;border:1px solid #394762;border-radius:16px;background:#171e2d;box-shadow:0 24px 80px #0009;padding:24px;display:flex;flex-direction:column}.voice-card-head{display:flex;align-items:center;justify-content:space-between}.voice-card-head h2{font:600 23px var(--display);margin:0}#voice-connection{color:var(--mint);font-size:11px}.video-grid{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;padding:22px 0}.video-tile{min-height:150px;border-radius:12px;background:#0d121d;overflow:hidden;display:grid;place-items:center;color:#8b97ad;font-size:12px}.video-tile video{width:100%;height:100%;object-fit:cover}.voice-controls{display:flex;justify-content:center;gap:12px}.voice-controls button{width:43px;height:43px;border:0;border-radius:50%;background:#2a354b;color:#e6e8f0;cursor:pointer}.voice-controls button:hover{background:#465473}.voice-controls .leave-voice{background:#db665f}.voice-controls svg{width:18px;height:18px}
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="server-rail" aria-label="Servers">
        <button class="brand-mark active" aria-label="Luma home"><i data-lucide="sparkles"></i></button>
        <div class="rail-rule"></div>
        <button class="server-bubble violet" aria-label="Luma House">LH</button>
        <button class="server-bubble add-server" aria-label="Add a server"><i data-lucide="plus"></i></button>
        <div class="rail-spacer"></div>
        <button class="rail-icon" aria-label="Discover"><i data-lucide="compass"></i></button>
        <button class="rail-icon" aria-label="Help"><i data-lucide="circle-help"></i></button>
        <a class="rail-icon friends-link" href="/friends" aria-label="Friends">♡</a>
      </aside>

      <aside class="channel-sidebar">
        <div class="workspace-head">
          <div>
            <p class="eyebrow">your workspace</p>
            <h1>Luma House</h1>
          </div>
          <button class="icon-button" aria-label="Workspace options"><i data-lucide="chevron-down"></i></button>
        </div>
        <div class="sidebar-search"><i data-lucide="search"></i><input aria-label="Search channels" placeholder="Find a channel" /></div>

        <nav class="channel-list" aria-label="Channels">
          <p class="section-label">Text channels <button class="tiny-plus" aria-label="Add text channel"><i data-lucide="plus"></i></button></p>
          <p class="section-label voice-label">Voice rooms <button class="tiny-plus" aria-label="Add voice room"><i data-lucide="plus"></i></button></p>
        </nav>

        <div class="user-card">
          <div class="avatar user-avatar">YO<span class="status-dot"></span></div>
          <div class="user-copy"><strong>you</strong><span>online</span></div>
          <button class="user-action" aria-label="Mute"><i data-lucide="mic"></i></button>
          <button class="user-action" id="logout" aria-label="Log out"><i data-lucide="log-out"></i></button>
        </div>
      </aside>

      <main class="chat-panel">
        <header class="chat-header">
          <div class="channel-title"><i class="header-hash" data-lucide="hash"></i><div><h2 id="channel-name">general</h2><p id="channel-description">A cozy corner for everyday conversations</p></div></div>
          <div class="header-actions"><button class="header-action" aria-label="Notifications"><i data-lucide="bell"></i></button><button class="header-action" aria-label="Pinned messages"><i data-lucide="pin"></i></button><button class="header-action" aria-label="Members"><i data-lucide="users"></i></button><div class="header-search"><input placeholder="Search" aria-label="Search messages" /><i data-lucide="search"></i></div><button class="header-action" aria-label="Inbox"><i data-lucide="inbox"></i></button><button class="header-action" aria-label="Help"><i data-lucide="circle-help"></i></button></div>
        </header>

        <section class="message-area" id="message-area" aria-live="polite">
          <div class="channel-welcome"><div class="welcome-symbol"><i data-lucide="hash"></i></div><h3>Welcome to #general</h3><p>This is the beginning of this channel. Say hello to the room.</p></div>
          <div id="message-list"></div>
        </section>

        <form class="composer" id="composer"><button type="button" class="compose-add" aria-label="Add attachment"><i data-lucide="plus"></i></button><input id="message-input" autocomplete="off" placeholder="Message #general" aria-label="Message channel" /><button type="button" class="compose-button" aria-label="Add gift"><i data-lucide="gift"></i></button><button type="button" class="compose-button emoji-trigger" aria-label="Add emoji"><i data-lucide="smile"></i></button><button class="send-button" aria-label="Send message"><i data-lucide="arrow-up"></i></button></form>
      </main>

      <aside class="member-sidebar">
        <div class="member-head"><h2>Members <span>8</span></h2><button class="icon-button" aria-label="Close member list"><i data-lucide="x"></i></button></div>
        <div id="member-list"></div>
      </aside>
    </div>
    <div class="profile-modal" id="profile-modal" aria-hidden="true"><div class="profile-backdrop" data-close-profile></div><section class="profile-card"><button class="profile-close" data-close-profile aria-label="Close profile">×</button><div class="profile-avatar" id="profile-avatar"></div><p class="profile-handle" id="profile-handle"></p><h2 id="profile-name"></h2><p class="profile-status" id="profile-status"></p><div class="profile-actions" id="profile-actions"></div></section></div>
    <div class="voice-modal" id="voice-modal" aria-hidden="true"><section class="voice-card"><div class="voice-card-head"><div><p class="eyebrow">live room</p><h2 id="voice-room-name">Voice room</h2></div><span id="voice-connection">Connecting…</span></div><div class="video-grid" id="video-grid"></div><div class="voice-controls"><button id="voice-mic" aria-label="Mute microphone"><i data-lucide="mic"></i></button><button id="voice-camera" aria-label="Turn camera on"><i data-lucide="video"></i></button><button class="leave-voice" id="leave-voice" aria-label="Leave room"><i data-lucide="phone-off"></i></button></div></section></div>
    <div class="toast" id="toast" role="status"></div>
    <script src="/app.js"></script>
  </body>
</html>
