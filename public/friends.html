<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luma — Friends</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/friends.css"></head><body><main class="friends-app"><header><a href="/" class="brand">✦ Luma</a><nav><a class="active" href="/friends">Friends</a><a href="/">Workspace</a></nav><button id="logout">Log out</button></header><section class="friends-layout"><aside><div class="aside-title"><h1>Friends</h1><button id="add-friend">Add friend</button></div><div class="tabs"><button class="active" data-tab="friends">All friends</button><button data-tab="pending">Pending</button></div><div id="friend-list"></div></aside><section class="dm-panel"><div class="dm-empty" id="dm-empty"><div>✦</div><h2>Your conversations</h2><p>Choose a friend to start a private conversation.</p></div><div class="dm-view" id="dm-view" hidden><div class="dm-head"><div class="avatar" id="dm-avatar"></div><div><h2 id="dm-name"></h2><p id="dm-status"></p></div></div><div class="dm-messages" id="dm-messages"></div><form id="dm-form"><input id="dm-input" placeholder="Message your friend" autocomplete="off"><button>Send</button></form></div></section></section></main><div class="toast" id="toast"></div><script src="/friends.js"></script></body></html>
